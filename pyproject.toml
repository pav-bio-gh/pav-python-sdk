[project]
name = "pav-bio"
version = "0.1.1"
description = "Python client for the Pav API: biopharma programs, drugs, companies, trials, deals, patents and FDA records."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pav", email = "support@pav.bio" }]
keywords = ["biopharma", "drug development", "clinical trials", "pav"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
# What the generated client imports (sdks/pav-bio-py/src/pav_bio is generated;
# see sdks/README.md).
dependencies = [
    "httpx>=0.21.2",
    "pydantic>=1.9.2",
    "pydantic-core>=2.18.2",
    "typing_extensions>=4.0.0",
]

[project.urls]
Documentation = "https://docs.pav.bio"
Homepage = "https://pav.bio"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pav_bio"]
